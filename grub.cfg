# GRUB boot configuration for RebirthAgain OS

set timeout=5
set default=0

# Цветовая схема (синяя тема)
set menu_color_normal=white/blue
set menu_color_highlight=yellow/blue

# Функция для рисования рамки
function draw_box {
    echo "┌─────────────────────────────────────────┐"
    echo "│          RebirthAgain OS                │"
    echo "└─────────────────────────────────────────┘"
    echo ""
}

draw_box

# Основное меню
menuentry "RebirthAgain OS" {
    echo "Loading RebirthAgain OS kernel..."
    multiboot /boot/kernel.elf
    echo "Starting kernel..."
    boot
}

# Режим с отладкой
menuentry "RebirthAgain OS (Debug mode)" {
    echo "Loading RebirthAgain OS with debug output..."
    multiboot /boot/kernel.elf
    set debug=all
    boot
}

# Информация о системе
menuentry "System Information" {
    echo "========================================="
    echo "  RebirthAgain OS - System Information"
    echo "========================================="
    echo ""
    echo "GRUB version: " $version
    echo "Root partition: " $root
    echo "Boot device: " $root
    echo "Prefix: " $prefix
    echo ""
    echo "Kernel: Multiboot compatible (32-bit)"
    echo "Build: ELF32"
    echo "License: GPLv3"
    echo ""
    echo "========================================="
    echo "Press any key to return to menu..."
    sleep --interruptible 3
    boot
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
